name: Compose IT

on:
  pull_request:
    paths:
      - docker-compose.yml
      - .env.example
      - docker/**
      - scripts/compose/**
      - scripts/empresa/**
      - config.ejemplo/**
      - Dockerfile
      - .dockerignore
      - supabase/migrations/mod_asignacion_*
      - src/modulos/asignacion/**
      - .github/workflows/compose-it.yml
  push:
    branches: [main]

# Only one compose-IT run per ref at a time — these are heavyweight.
concurrency:
  group: compose-it-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose-it:
    name: docker compose up --wait (clean machine)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run compose integration test
        run: COMPOSE_IT=1 npx vitest run scripts/compose/compose-up.it.test.ts
        env:
          COMPOSE_IT: '1'

      - name: Run repo-hijo integration test
        run: COMPOSE_IT=1 npx vitest run scripts/empresa/repo-hijo.it.test.ts
        env:
          COMPOSE_IT: '1'

      - name: Run policies integration test
        run: COMPOSE_IT=1 npx vitest run scripts/empresa/policies.it.test.ts
        env:
          COMPOSE_IT: '1'

      - name: Dump logs on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --tail 200
          docker compose --project-name wacrm-empresa-it ps
          docker compose --project-name wacrm-empresa-it logs --tail 200
          docker compose --project-name wacrm-policies-it ps
          docker compose --project-name wacrm-policies-it logs --tail 200

  asignacion-it:
    name: motor de asignación contra Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run asignacion integration test
        run: COMPOSE_IT=1 npx vitest run src/modulos/asignacion/asignacion.it.test.ts
        env:
          COMPOSE_IT: '1'

      - name: Dump logs on failure
        if: failure()
        run: |
          docker compose --project-name wacrm-asignacion-it ps
          docker compose --project-name wacrm-asignacion-it logs --tail 200
