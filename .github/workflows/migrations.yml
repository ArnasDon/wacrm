name: Migrations
on:
  pull_request:
    paths:
      [
        'database/**',
        'scripts/db-migrate.mjs',
        'scripts/lib/**',
        '.github/workflows/migrations.yml',
      ]
  push:
    branches: [main]
    paths:
      [
        'database/**',
        'scripts/db-migrate.mjs',
        'scripts/lib/**',
        '.github/workflows/migrations.yml',
      ]
concurrency:
  group: migrations-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apply:
    name: Apply standalone PostgreSQL schema
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: omni_connect
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d omni_connect"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: ci-only-password
      MIGRATION_DATABASE_URL: postgresql://postgres:ci-only-password@localhost:5432/omni_connect
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Create local application roles
        run: psql -h localhost -U postgres -d omni_connect -v ON_ERROR_STOP=1 -f database/bootstrap.sql
      - name: Apply migrations
        run: npm run db:migrate
      - name: Verify idempotency
        run: npm run db:migrate
      - name: Verify schema and role security
        run: npm test -- src/lib/db/schema.integration.test.ts --reporter=dot
