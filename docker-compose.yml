name: wacrm

services:
  app:
    build:
      context: .
      # NEXT_PUBLIC_* vars are inlined at build time — forward them
      # from .env.local as build args. Changing any of them requires
      # a rebuild (docker compose up --build).
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
        NEXT_PUBLIC_APP_LOCALE: ${NEXT_PUBLIC_APP_LOCALE:-en}
    # Runtime (server-only) secrets come from .env.local; they are
    # never baked into the image.
    env_file:
      - .env.local
    # The server always listens on 3000 inside the container. Pinned
    # here because `environment` wins over `env_file`, so a stray PORT
    # in .env.local can't desync the app from the mapping and the
    # healthcheck below.
    environment:
      PORT: 3000
    # Bloco 3-A — Google service account key for the commercial
    # calendar (domain-wide delegation, geral@etergrowth.com). Lives
    # OUTSIDE the app/git tree on the host (never baked into the image
    # — `.dockerignore`'s `.env*` rule doesn't even cover this path,
    # since it's not an env file) and is mounted read-only.
    # `GOOGLE_SA_HOST_PATH` (set in `.env.local`, NOT committed) points
    # at the real key file on THIS host; it defaults to `/dev/null` so
    # `docker compose up` still works for anyone who hasn't configured
    # Bloco 3-A's commercial calendar — the feature only errors if a
    # conversation actually tries to use it (see
    # loadServiceAccountFromEnv in service-account.ts), never at boot.
    # `.env.local`'s own `GOOGLE_SERVICE_ACCOUNT_JSON` must point at
    # the path on the RIGHT below (in-container), not the host path.
    volumes:
      - ${GOOGLE_SA_HOST_PATH:-/dev/null}:/run/secrets/google-sa.json:ro
    # Host side only — HOST_PORT=8080 publishes the app on :8080.
    ports:
      - '${HOST_PORT:-3000}:3000'
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000').then((r)=>process.exit(r.ok||r.status<500?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
