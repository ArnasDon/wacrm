name: wacrm

services:
  app:
    build:
      context: .
      # NEXT_PUBLIC_* vars are inlined at build time — forward them
      # from .env.local as build args. Changing any of them requires
      # a rebuild (docker compose up --build).
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
        NEXT_PUBLIC_APP_LOCALE: ${NEXT_PUBLIC_APP_LOCALE:-en}
    # Runtime (server-only) secrets come from .env.local; they are
    # never baked into the image.
    env_file:
      - .env.local
    # The server always listens on 3000 inside the container. Pinned
    # here because `environment` wins over `env_file`, so a stray PORT
    # in .env.local can't desync the app from the mapping and the
    # healthcheck below.
    environment:
      PORT: 3000
    # Host side only — HOST_PORT=8080 publishes the app on :8080.
    ports:
      - '${HOST_PORT:-3000}:3000'
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000').then((r)=>process.exit(r.ok||r.status<500?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ------------------------------------------------------------------
  # Kafka (local development / self-hosting) — opt in with:
  #   docker compose --profile kafka up -d kafka          # broker only
  #   docker compose --profile kafka up -d                # + app + worker
  #
  # Single-node KRaft broker (no ZooKeeper). Two listeners:
  #   kafka:9092      for containers (set KAFKA_BROKERS=kafka:9092)
  #   localhost:9094  for `npm run dev` on the host
  # In production use Amazon MSK instead (see docs/kafka.md).
  # ------------------------------------------------------------------
  kafka:
    image: apache/kafka:3.9.1
    profiles: ['kafka']
    ports:
      - '9094:9094'
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_NUM_PARTITIONS: 6
    volumes:
      - kafka-data:/var/lib/kafka/data
    restart: unless-stopped

  # ------------------------------------------------------------------
  # Redis — one shared speed limit per WhatsApp number across all
  # campaigns and workers (src/lib/campaigns/channel-limiter.ts).
  #   redis:6379      for containers (REDIS_URL=redis://redis:6379)
  #   localhost:6379  for `npm run dev` (REDIS_URL=redis://localhost:6379)
  # In production use Amazon ElastiCache (see docs/kafka.md).
  # ------------------------------------------------------------------
  redis:
    image: redis:7.4-alpine
    profiles: ['kafka']
    ports:
      - '6379:6379'
    # Limiter state only (rebuilt in a second) — no persistence needed.
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    profiles: ['kafka']
    env_file:
      - .env.local
    environment:
      KAFKA_BROKERS: kafka:9092
      REDIS_URL: redis://redis:6379
    depends_on:
      - kafka
      - redis
    restart: unless-stopped

volumes:
  kafka-data:
