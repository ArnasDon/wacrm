# ============================================================
# Docker Swarm stack for the CRM, fronted by the existing Traefik.
#
# First deploy (on the VPS):
#   set -a && source crm.env && set +a
#   docker stack deploy -c docker-stack.yml crm
#
# Values below match THIS VPS's Traefik (confirmed via SSH), mirroring the
# working Evolution service: overlay network `CBAdvNet`, entrypoint
# `websecure` (:443, with :80->:443 redirect), cert resolver
# `letsencryptresolver`. Traefik issues the TLS cert automatically once
# crm.cbadvogados.com's DNS points at the VPS.
# ============================================================

services:
  crm:
    # Built + pushed by CI (see .github/workflows/pipeline.yml). Override the
    # tag at deploy time with CRM_IMAGE=ghcr.io/leonardocabralb/cb-crm:<sha>.
    # ⚠️ Tire o CRM_IMAGE de `.Spec.TaskTemplate.ContainerSpec.Image`, NUNCA
    # do rótulo `com.docker.stack.image`: o CI publica com `docker service
    # update`, que não reescreve o rótulo — ele guarda a imagem do último
    # deploy MANUAL e rola a produção para trás em silêncio.
    image: ${CRM_IMAGE:-ghcr.io/leonardocabralb/cb-crm:latest}
    environment:
      # NEXT_PUBLIC_* are also read server-side at runtime; keep them here.
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      NEXT_PUBLIC_SITE_URL: https://crm.cbadvogados.com
      NEXT_PUBLIC_APP_LOCALE: pt-BR
      # Server-only secrets.
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      AUTOMATION_CRON_SECRET: ${AUTOMATION_CRON_SECRET}
      # Meta secret arrives at the production cutover — optional for now.
      META_APP_SECRET: ${META_APP_SECRET:-}
      # Evolution transport (WhatsApp gateway) — server + keys + webhook secret.
      EVOLUTION_BASE_URL: ${EVOLUTION_BASE_URL:-}
      EVOLUTION_GLOBAL_API_KEY: ${EVOLUTION_GLOBAL_API_KEY:-}
      EVOLUTION_WEBHOOK_SECRET: ${EVOLUTION_WEBHOOK_SECRET:-}
    networks:
      - CBAdvNet
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      update_config:
        order: start-first # zero-downtime: new task healthy before old stops
        failure_action: rollback
      labels:
        - traefik.enable=true
        - traefik.docker.network=CBAdvNet
        - traefik.http.routers.crm.rule=Host(`crm.cbadvogados.com`)
        - traefik.http.routers.crm.entrypoints=websecure
        - traefik.http.routers.crm.tls.certresolver=letsencryptresolver
        - traefik.http.routers.crm.service=crm
        - traefik.http.services.crm.loadbalancer.server.port=3000
        - traefik.http.services.crm.loadbalancer.passHostHeader=true

  # ============================================================
  # O agendador. Bate nas rotas de cron do CRM em DOIS laços paralelos:
  # 60s para as automações (esperas e fila de funil) e 900s para agendadas,
  # fluxos e radar. Ver o `command` abaixo — a descrição de "um laço de 15
  # minutos" valeu até o laço rápido nascer.
  #
  # ⚠️ SEM ESTE SERVIÇO, MENSAGEM AGENDADA NÃO SAI. A migration 925 guarda a
  # linha; quem a transforma em mensagem é `/api/cb/scheduled/cron`, e nada
  # no projeto chama essa rota sozinho — Next.js não tem agendador embutido,
  # não há `vercel.json`, e `pg_cron` não está instalado no Supabase.
  #
  # ⚠️ O CI NÃO SOBE ESTE SERVIÇO. O `pipeline.yml` termina em
  # `docker service update … crm_crm`, que só troca a imagem do serviço que
  # já existe. Serviço novo — e QUALQUER mudança neste arquivo, inclusive no
  # `command` do agendador — exige UM `docker stack deploy` na VPS, à mão.
  # Ver `docs/DEPLOY-VPS.md`.
  #
  # ⚠️ ELE TAMBÉM RESSUSCITA AUTOMAÇÕES E FLUXOS. As duas rotas abaixo
  # existem no código desde o upstream e nunca foram chamadas em produção:
  # automação com espera e fluxo com timeout estão mortos desde sempre, e
  # ninguém percebeu porque nada dependia deles. Ligar aqui os conserta.
  # Medido em 2026-08-01, antes de escrever isto: `automation_pending_
  # executions` tem 0 linhas e não há nenhuma `flow_runs` ativa — ou seja,
  # não há fila represada para drenar de uma vez no primeiro ciclo.
  agendador:
    # Imagem minúscula (~10 MB) que já traz curl e um shell. Fixada por
    # versão: `:latest` faria o agendador mudar sozinho num restart.
    image: curlimages/curl:8.11.1
    environment:
      AUTOMATION_CRON_SECRET: ${AUTOMATION_CRON_SECRET}
    # `crm_crm` é o nome DNS do serviço dentro da rede (<stack>_<serviço>).
    # Por dentro da overlay: sem sair para a internet, sem TLS, sem depender
    # do Traefik nem do certificado.
    #
    # ⚠️ A agendada vem PRIMEIRO no laço lento, e não é ordem alfabética: as
    # outras duas rotas varrem fluxos e radar, e uma delas lenta faria a
    # mensagem do cliente esperar atrás. O `-m 120` corta cada chamada bem
    # antes do ciclo seguinte; o `|| true` existe para que o CRM reiniciando
    # não derrube o laço.
    #
    # ⚠️ DOIS LAÇOS, e a separação é load-bearing.
    #
    # O laço de 15 min NÃO PODE encolher: o número tem de bater com
    # `CICLO_MINUTOS` em `src/lib/scheduled/display.ts`, que define a grade de
    # horários que a tela de agendadas oferece e o texto "sai em até 15 min".
    # Mudar um sem o outro faz a tela prometer o que o servidor não cumpre.
    #
    # Já as automações precisam do oposto. Desde a 933 o cron delas também
    # drena a fila de eventos de funil e varre os lembretes por data, e desde
    # sempre é ele que acorda o passo "Aguardar". Num ciclo de 15 minutos,
    # "esperar 2 minutos" vira "esperar até 15", e o lembrete de reunião erra
    # a hora pelo mesmo tanto. Daí um laço próprio, curto.
    #
    # (A fila de funil tem ainda um aviso imediato disparado por quem move o
    # card, então o caso comum já sai em segundos; este laço é a rede de
    # segurança e o relógio das esperas.)
    #
    # ⚠️ O laço rápido é de 15s desde 2026-09-08, e o número É a precisão da
    # espera em SEGUNDOS do passo "Aguardar": uma pausa de 10 s acorda no tique
    # seguinte, então o piso real da pausa é este intervalo. Alargá-lo de volta
    # para 60 s não quebra nada — só faz as pausas curtas das automações do
    # escritório (10 s entre mensagens, 30 s de folga para o webhook) durarem
    # até um minuto, sem nada na tela dizendo por quê.
    #
    # Custo medido antes de encurtar: um ciclo ocioso faz ~12 consultas
    # (drenar a fila, podar, varrer lembretes, podar, batimento, buscar
    # esperas). A 15s isso é menos de uma consulta por segundo. E o laço é
    # SEQUENCIAL — `curl` e só então `sleep` —, então ciclo lento não empilha
    # com o seguinte; o intervalo real é "15s depois que o anterior terminou".
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "[agendador] laço rápido (15s) para automações + laço de 15min para agendadas, fluxos, radar, Meta Ads, tl;dv e Asaas"
        while true; do
          curl -fsS -m 50 -o /dev/null \
            -H "x-cron-secret: $$AUTOMATION_CRON_SECRET" \
            "http://crm_crm:3000/api/automations/cron" || true
          sleep 15
        done &
        while true; do
          for rota in cb/scheduled flows cb/radar cb/meta-ads cb/tldv cb/asaas; do
            curl -fsS -m 120 -o /dev/null \
              -H "x-cron-secret: $$AUTOMATION_CRON_SECRET" \
              "http://crm_crm:3000/api/$$rota/cron" || true
          done
          sleep 900
        done
    networks:
      - CBAdvNet
    deploy:
      # ⚠️ UMA réplica, e não é detalhe de custo. Duas fariam dois ciclos
      # simultâneos; a reivindicação em dois passos (`UPDATE … WHERE status
      # = 'pending'`) impede o envio dobrado, mas não há motivo para
      # depender dela a cada ciclo.
      replicas: 1
      restart_policy:
        condition: any

networks:
  CBAdvNet:
    external: true # the overlay Traefik + Evolution already share
