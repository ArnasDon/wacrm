<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sin conexión — Chat Sandía</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #020617;
        color: #e2e8f0;
        font: 15px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .card { max-width: 340px; text-align: center; }
      .mark {
        width: 56px; height: 56px; border-radius: 14px;
        background: #7c3aed; display: grid; place-items: center;
        margin: 0 auto 20px;
      }
      h1 { font-size: 18px; margin: 0 0 8px; color: #f8fafc; }
      p { margin: 0 0 20px; color: #94a3b8; }
      button {
        appearance: none; border: 0; cursor: pointer;
        background: #7c3aed; color: #fff; font: inherit; font-weight: 600;
        padding: 10px 18px; border-radius: 10px;
      }
      button:active { opacity: 0.85; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark" aria-hidden="true">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
        </svg>
      </div>
      <h1>Sin conexión</h1>
      <p>No se pudo cargar Chat Sandía. Revisá tu conexión e intentá de nuevo.</p>
      <button onclick="location.reload()">Reintentar</button>
    </div>
  </body>
</html>
