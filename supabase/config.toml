# Supabase CLI configuration.
#
# Used for local development and CI migration verification.
# Hosted project settings such as Auth providers, SMTP, storage
# limits and rate limits remain configured in the Supabase dashboard.

project_id = "wacrm"

[api]
enabled = true
# Port to use for the local API URL.
port = 54321

# Schemas exposed through the Data API.
schemas = ["public", "graphql_public"]

# Extra schemas added to the search_path.
extra_search_path = ["public", "extensions"]

# Maximum number of rows returned from a view, table,
# or stored procedure.
max_rows = 1000

# New tables created in public are not automatically exposed.
# auto_expose_new_tables = true

[api.tls]
# Enable HTTPS locally using a self-signed certificate.
enabled = false

# cert_path = "../certs/my-cert.pem"

[db]
# Local Postgres configuration.
port = 54322
shadow_port = 54320

# Keep aligned with the hosted project's Postgres version.
major_version = 17